[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fontplayground"
version = "0.1.0"
description = "Browse, preview and forge fonts into one file"
requires-python = ">=3.10"
dependencies = [
  "fonttools[unicode]>=4.65",
  "skia-pathops>=0.9",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
fontplayground = "fontplayground.__main__:main"

[tool.setuptools.packages.find]
include = ["fontplayground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
